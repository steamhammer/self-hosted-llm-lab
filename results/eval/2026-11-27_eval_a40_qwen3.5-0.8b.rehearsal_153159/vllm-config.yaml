# Rehearsal on the cheapest 24 GB card (RTX 3090 / A5000 class): checks the pipeline, not the GPU.
# The 0.8B model downloads in seconds and fits anywhere, so a failed rehearsal costs cents.
#
#   vllm serve --config serving/configs/qwen3.5-0.8b.rehearsal.yaml --port 8000
#
# Keys are vLLM's long flag names without the leading dashes:
# https://docs.vllm.ai/en/latest/configuration/serve_args.html
model: Qwen/Qwen3.5-0.8B
# Text-only: skip the vision encoder and its memory profiling (vLLM Qwen3.5 recipe:
# https://docs.vllm.ai/projects/recipes/en/latest/Qwen/Qwen3.5.html).
language-model-only: true
reasoning-parser: qwen3
# Thinking off on the server side as well as in the plans (methodology §3.4).
default-chat-template-kwargs: '{"enable_thinking": false}'
# The longest scenario (rag) needs ~4.3k tokens; a small window leaves memory for the KV cache.
max-model-len: 8192
gpu-memory-utilization: 0.90
max-num-seqs: 128
seed: 0
