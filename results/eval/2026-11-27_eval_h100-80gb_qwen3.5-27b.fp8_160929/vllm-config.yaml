# Qwen3.5-27B, fp8. FP8 weights (~29 GB): one 48 GB card (L40S, A40) or larger. Native FP8 on Ada/Hopper; on Ampere (A100, A40) vLLM falls back to weight-only FP8 kernels.
#
#   vllm serve --config serving/configs/qwen3.5-27b.fp8.yaml --port 8000
#
# Flag reference: https://docs.vllm.ai/en/latest/configuration/serve_args.html
# Model recipe:   https://recipes.vllm.ai/Qwen/Qwen3.5-27B
model: Qwen/Qwen3.5-27B-FP8
language-model-only: true
reasoning-parser: qwen3
default-chat-template-kwargs: '{"enable_thinking": false}'
max-model-len: 8192
gpu-memory-utilization: 0.92
max-num-seqs: 128
seed: 0
