# Builds the lab image (infra/image/Dockerfile) and pushes it to GHCR:
#   ghcr.io/<owner>/llm-lab:<commit sha>   — pin this in .env (LAB_IMAGE) for measured runs
#   ghcr.io/<owner>/llm-lab:main           — latest build of main, fine for rehearsals
# After the first push, make the package public once (GitHub → Packages → llm-lab → Package
# settings → Change visibility) so RunPod and Vast.ai can pull it without registry credentials.
# The image holds no secrets: keys arrive as pod environment variables.
name: lab-image

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - bench/**
      - serving/**
      - loadgen/**
      - gateway/**
      - mock-upstream/**
      - pnpm-lock.yaml
      - docs/methodology.md
      - .github/workflows/lab-image.yml
  workflow_dispatch:

concurrency:
  group: lab-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The vLLM base image is ~10 GB; a stock runner has too little free disk to re-push it.
      # https://github.com/jlumbroso/free-disk-space
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: false
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/image/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            LAB_GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/llm-lab:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/llm-lab:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lab-image
          cache-to: type=gha,scope=lab-image,mode=min
