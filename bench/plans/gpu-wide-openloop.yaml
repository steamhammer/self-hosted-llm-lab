# Experiment 2: the chat ladder again, with open-loop rates up to 150% of the closed-loop ceiling.
# Experiment 1 stopped at 90%, and on the H100 all four rates passed, so its real request-rate
# ceiling (and the $/1M it implies) was never found. Same settings as gpu.yaml otherwise.
name: gpu-wide-openloop
model: Qwen/Qwen3.5-9B
target: http://127.0.0.1:8000          # vLLM directly; use :8080 to measure through the gateway
tokenizeUrl: http://127.0.0.1:8000     # vLLM itself (the gateway does not proxy /tokenize)
metricsUrl: http://127.0.0.1:8000/metrics
readyUrl: http://127.0.0.1:8000/health
scenarios: [chat]
ladder:
  concurrency: [1, 2, 4, 8, 16, 32, 64, 128]
  stopAfterViolations: 2
openLoop:
  fractions: [0.25, 0.5, 0.75, 0.9, 1.0, 1.1, 1.25, 1.5]
point:
  warmupSeconds: 30
  warmupRequests: 20
  maxRequests: 300
  maxSeconds: 90
  minRequests: 30
  cooldownSeconds: 5
extraBody:
  chat_template_kwargs: { enable_thinking: false }   # methodology §3.4
hooks:
  beforeScenario: infra/serve.sh restart   # fresh server per scenario: no warm cache carried over
seed: 1
