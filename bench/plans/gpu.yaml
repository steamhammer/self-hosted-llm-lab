# Full campaign on a rented GPU (methodology §4). Target and model are usually overridden:
#   loadgen matrix --plan bench/plans/gpu.yaml --model Qwen/Qwen3.5-9B --label 4090_qwen3.5-9b_bf16
name: gpu
model: Qwen/Qwen3.5-9B
target: http://127.0.0.1:8000          # vLLM directly; use :8080 to measure through the gateway
tokenizeUrl: http://127.0.0.1:8000     # vLLM itself (the gateway does not proxy /tokenize)
metricsUrl: http://127.0.0.1:8000/metrics
readyUrl: http://127.0.0.1:8000/health
scenarios: [chat, rag, longgen]
ladder:
  concurrency: [1, 2, 4, 8, 16, 32, 64, 128]
  stopAfterViolations: 2
openLoop:
  fractions: [0.25, 0.5, 0.75, 0.9]
point:
  warmupSeconds: 30
  warmupRequests: 20
  maxRequests: 300
  maxSeconds: 90
  minRequests: 30
  cooldownSeconds: 5
extraBody:
  chat_template_kwargs: { enable_thinking: false }   # methodology §3.4
hooks: {}
  # beforeScenario: infra/restart-vllm.sh            # phase 4: fresh server per scenario
seed: 1
