[project]
name = "bench"
version = "0.1.0"
description = "Benchmark analysis: tables, capacity under SLO, cost per 1M tokens, charts"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "matplotlib>=3.9",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["ruff", "pytest"]
# Experiment 2 quality runs (bench/eval). Pinned: task prompts and extraction change between
# lm-eval releases, and every score must come from the same version (docs/adr/0007).
eval = ["lm-eval[api,ifeval]==0.4.13"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
